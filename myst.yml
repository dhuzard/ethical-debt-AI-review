version: 1
extends:
  - content/authors.yml
project:
  title: "The Ethical Debt"
  subtitle: Why wasting animal data is wasting animal lives
  description: >
    A manifesto on data welfare, FAIR preclinical data, the 3Rs, NAMs, virtual control groups, and research incentives. The Ethical Debt of preclinical research is created when animals are used to generate knowledge, but the resulting data are allowed to become unusable. Data welfare is animal welfare because preserving, structuring, annotating, citing and reusing animal-derived data is part of the moral contract of animal research.
  keywords:
    - neuroscience
    - critical review
    - reproducible research
    - FAIR data
    - animal welfare
    - 3Rs
  license: MIT
  open_access: true
  numbering:
    figure:
      continue: true
    table:
      continue: true
    equation:
      continue: true
    code:
      continue: true
  plugins:
    - plugins/authorship-plugin.mjs
    - plugins/evidence-explorer-plugin.mjs
    - plugins/figure-lightbox-plugin.mjs
    - plugins/trust-claim-plugin.mjs
  github: https://github.com/dhuzard/ethical-debt-AI-review
  bibliography:
    - content/references.bib
  toc:
    - file: content/00_frontmatter.md
    - file: content/01_introduction.md
    - file: content/02_reproducibility_crisis.md
    - file: content/03_data_welfare_3rs.md
    - file: content/04_fair_preclinical_data.md
    - file: content/05_virtual_control_groups.md
    - file: content/06_nams_data.md
    - file: content/07_incentives.md
    - file: content/08_governance_pathways.md
    - file: content/09_conclusion.md
    - file: content/trust_summary.md
      title: Citation Trust Summary
    - file: content/Methods.md
      title: Methods
    - file: content/evidence_database.md
      title: Evidence Database
    - file: content/provenance.md
      title: Pipeline Provenance
  exports:
    - format: tex
      output: review_manuscript.tex
      template: ./latex/template
    - format: pdf
      output: review_manuscript.pdf
      template: ./latex/template
site:
  template: book-theme
  title: "The Ethical Debt"
  nav:
    - title: GitHub
      url: https://github.com/dhuzard/ethical-debt-AI-review
