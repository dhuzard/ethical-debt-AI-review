name: Build and Deploy MyST Site

on:
  push:
    branches: [main, trust-scores]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A branch push and its same-commit PR event arrive together. Keep their
  # validation runs independent so the PR run cannot cancel the deploy-capable
  # push run before it uploads the Pages artifact.
  group: "pages-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate TRUST knowledge
        run: |
          node scripts/validate-trust.js
          node scripts/test-trust-validator.js
          node --test tests/*.test.mjs

      - name: Install build dependencies
        run: |
          pip install mystmd jupyter matplotlib numpy pandas seaborn
          npm install -g mystmd

      - name: Execute figure notebooks
        run: |
          if ls figures/notebooks/*.ipynb 1>/dev/null 2>&1; then
            for nb in figures/notebooks/*.ipynb; do
              echo "Executing $nb..."
              jupyter execute "$nb" --timeout=120
            done
          else
            echo "No figure notebooks found"
          fi

      - name: Build MyST site
        env:
          BASE_URL: /ethical-debt-AI-review
        run: myst build --html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/trust-scores'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/trust-scores'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
