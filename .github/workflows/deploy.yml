name: Build and Deploy MyST Site

on:
  push:
    branches: [main, trust-scores]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A branch push and its same-commit PR event arrive together. Keep their
  # validation runs independent so the PR run cannot cancel the deploy-capable
  # push run before it uploads the Pages artifact.
  group: "pages-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate TRUST knowledge
        run: |
          node scripts/record-counts.js
          node scripts/human-review-store.js
          node scripts/review-priority.js
          node scripts/claim-quality-audit.js
          node scripts/validate-evidence.js
          node scripts/validate-oratlas.js
          node scripts/build-oratlas-fixtures.js
          node scripts/validate-trust.js
          node scripts/test-trust-validator.js
          node scripts/release-artifacts.js
          node scripts/validate-release.js
          node --test tests/*.test.mjs tests/*.test.cjs

      - name: Install build dependencies
        run: pip install --requirement requirements.txt

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser and accessibility regressions
        run: npx playwright test

      - name: Execute figure notebooks
        run: python scripts/check_deterministic_figures.py

      - name: Build MyST site
        env:
          BASE_URL: /ethical-debt-AI-review
        run: node scripts/check-deterministic-build.js

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/trust-scores'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/trust-scores'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
